name: EchoCore XEX CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/echocore-xex-ci.yml"
      - "echocore/**"

concurrency:
  group: echocore-xex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENXECHAIN_BUILD_SHA: eed1fa65bf9577fd31625764b320a90182ea9ade
  OPENXECHAIN_SYSROOT: /tmp/openxechain-sysroot
  ECHO_TOOLCHAIN_CACHE_VERSION: v4
  CCACHE_DIR: /tmp/echocore-ccache
  CCACHE_MAXSIZE: 2G

jobs:
  core-host-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 6

    steps:
      - name: Checkout Echo360
        uses: actions/checkout@v5

      - name: Run complete EchoCore host suite
        run: bash echocore/tests/run-host-tests.sh

      - name: Verify physical pairing KDF vector
        run: |
          python3 - <<'PY'
          import hashlib
          token = bytes(range(16))
          expected = '7344e42de48a363d0454babae5d527f1bf0b43e319fd18da2062ebf524d050f4'
          actual = hashlib.sha256(b'ECHO360-PAIRING-TOKEN-V1' + token).hexdigest()
          assert actual == expected, (actual, expected)
          PY

  llvm-stage:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout Echo360
        uses: actions/checkout@v5

      - name: Restore finished OpenXeChain toolchain
        id: final-toolchain
        uses: actions/cache/restore@v4
        with:
          path: /tmp/openxechain-sysroot
          key: echocore-openxechain-final-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-cmake-3.31.10-${{ hashFiles('echocore/openxechain/build-minimal-toolchain-fast.sh') }}

      - name: Restore installed LLVM checkpoint
        if: steps.final-toolchain.outputs.cache-hit != 'true'
        id: llvm-stage-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/openxechain-sysroot
          key: echocore-openxechain-llvm-stage-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-cmake-3.31.10-${{ hashFiles('echocore/openxechain/build-minimal-toolchain-fast.sh') }}

      - name: Install LLVM build dependencies
        if: steps.final-toolchain.outputs.cache-hit != 'true' && steps.llvm-stage-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            binutils \
            ccache \
            ninja-build \
            make \
            python3 \
            python3-pip \
            git \
            zlib1g-dev
          python3 -m pip install --user "cmake==3.31.10"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version
          ccache --version

      - name: Clone pinned OpenXeChain LLVM source
        if: steps.final-toolchain.outputs.cache-hit != 'true' && steps.llvm-stage-cache.outputs.cache-hit != 'true'
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --no-checkout --filter=blob:none https://github.com/OpenXeChain/buildscript.git /tmp/openxechain
          cd /tmp/openxechain
          git checkout "$OPENXECHAIN_BUILD_SHA"
          git submodule sync --recursive
          git submodule update --init --depth 1 llvm
          test "$(git rev-parse HEAD)" = "$OPENXECHAIN_BUILD_SHA"
          git submodule status llvm

      - name: Restore LLVM ccache checkpoint
        if: steps.final-toolchain.outputs.cache-hit != 'true' && steps.llvm-stage-cache.outputs.cache-hit != 'true'
        id: llvm-ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/echocore-ccache
          key: echocore-openxechain-ccache-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-${{ github.run_id }}
          restore-keys: |
            echocore-openxechain-ccache-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-
            echocore-openxechain-ccache-v3-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-

      - name: Build and install minimal LLVM stage serially
        id: llvm-build
        if: steps.final-toolchain.outputs.cache-hit != 'true' && steps.llvm-stage-cache.outputs.cache-hit != 'true'
        env:
          LLVM_PARALLEL: 1
          USE_CCACHE: 1
        run: |
          set -o pipefail
          : > /tmp/echocore-llvm-stage.log
          bash echocore/openxechain/build-minimal-toolchain-fast.sh /tmp/openxechain llvm-stage \
            2>&1 | tee /tmp/echocore-llvm-stage.log

      # Save compiler object work even if a later stage fails. The key is per-run
      # and restore-keys select the newest compatible checkpoint next time.
      - name: Save LLVM ccache checkpoint
        if: always() && steps.final-toolchain.outputs.cache-hit != 'true' && steps.llvm-stage-cache.outputs.cache-hit != 'true' && steps.llvm-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/echocore-ccache
          key: echocore-openxechain-ccache-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-${{ github.run_id }}

      - name: Upload LLVM build diagnostics
        if: always() && steps.final-toolchain.outputs.cache-hit != 'true' && steps.llvm-stage-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: echocore-llvm-stage-log-${{ github.sha }}
          path: /tmp/echocore-llvm-stage.log
          if-no-files-found: warn
          retention-days: 14

      # Critical boundary: checkpoint the installed sysroot BEFORE any contract
      # test. A verifier failure can now cost seconds/minutes, never the LLVM build.
      - name: Save installed LLVM checkpoint
        if: steps.final-toolchain.outputs.cache-hit != 'true' && steps.llvm-stage-cache.outputs.cache-hit != 'true' && steps.llvm-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /tmp/openxechain-sysroot
          key: echocore-openxechain-llvm-stage-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-cmake-3.31.10-${{ hashFiles('echocore/openxechain/build-minimal-toolchain-fast.sh') }}

      - name: Package durable LLVM checkpoint
        if: steps.final-toolchain.outputs.cache-hit != 'true' && steps.llvm-stage-cache.outputs.cache-hit != 'true' && steps.llvm-build.outcome == 'success'
        run: |
          tar -C /tmp -czf /tmp/echocore-openxechain-llvm-stage.tar.gz openxechain-sysroot
          ls -lh /tmp/echocore-openxechain-llvm-stage.tar.gz

      - name: Upload durable LLVM checkpoint
        if: steps.final-toolchain.outputs.cache-hit != 'true' && steps.llvm-stage-cache.outputs.cache-hit != 'true' && steps.llvm-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: echocore-openxechain-llvm-stage-${{ github.sha }}
          path: /tmp/echocore-openxechain-llvm-stage.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Verify installed LLVM contract
        if: steps.final-toolchain.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          : > /tmp/echocore-llvm-verify.log
          bash echocore/openxechain/build-minimal-toolchain-fast.sh /tmp/openxechain llvm-verify \
            2>&1 | tee /tmp/echocore-llvm-verify.log
          free -h
          df -h /tmp
          du -sh "$OPENXECHAIN_SYSROOT"

      - name: Upload LLVM contract diagnostics
        if: always() && steps.final-toolchain.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: echocore-llvm-contract-log-${{ github.sha }}
          path: /tmp/echocore-llvm-verify.log
          if-no-files-found: warn
          retention-days: 14

  toolchain:
    needs:
      - llvm-stage
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Echo360
        uses: actions/checkout@v5

      - name: Restore finished OpenXeChain toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/openxechain-sysroot
          key: echocore-openxechain-final-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-cmake-3.31.10-${{ hashFiles('echocore/openxechain/build-minimal-toolchain-fast.sh') }}

      - name: Restore installed LLVM checkpoint
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/openxechain-sysroot
          key: echocore-openxechain-llvm-stage-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-cmake-3.31.10-${{ hashFiles('echocore/openxechain/build-minimal-toolchain-fast.sh') }}
          fail-on-cache-miss: true

      - name: Install finalization dependencies
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            binutils \
            ninja-build \
            make \
            python3 \
            python3-pip \
            git \
            zlib1g-dev
          python3 -m pip install --user "cmake==3.31.10"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version

      - name: Clone pinned xecorelib and SynthXEX sources
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --no-checkout --filter=blob:none https://github.com/OpenXeChain/buildscript.git /tmp/openxechain
          cd /tmp/openxechain
          git checkout "$OPENXECHAIN_BUILD_SHA"
          git submodule sync --recursive
          git submodule update --init --depth 1 xecorelib synthxex
          test "$(git rev-parse HEAD)" = "$OPENXECHAIN_BUILD_SHA"
          git submodule status xecorelib synthxex

      - name: Finalize OpenXeChain sysroot
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          : > /tmp/echocore-toolchain-finalize.log
          bash echocore/openxechain/build-minimal-toolchain-fast.sh /tmp/openxechain finalize \
            2>&1 | tee /tmp/echocore-toolchain-finalize.log

      - name: Upload toolchain finalization diagnostics
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: echocore-toolchain-finalize-log-${{ github.sha }}
          path: /tmp/echocore-toolchain-finalize.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify complete toolchain
        run: |
          test -x "$OPENXECHAIN_SYSROOT/bin/clang"
          test -x "$OPENXECHAIN_SYSROOT/bin/lld-link"
          test -x "$OPENXECHAIN_SYSROOT/bin/llvm-ar"
          test -x "$OPENXECHAIN_SYSROOT/bin/llvm-dlltool"
          test -x "$OPENXECHAIN_SYSROOT/bin/synthxex"
          test -s "$OPENXECHAIN_SYSROOT/lib/xecorelib.a"
          "$OPENXECHAIN_SYSROOT/bin/clang" --version
          "$OPENXECHAIN_SYSROOT/bin/llvm-dlltool" --version
          du -sh "$OPENXECHAIN_SYSROOT"

      - name: Save finished OpenXeChain toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/openxechain-sysroot
          key: echocore-openxechain-final-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-cmake-3.31.10-${{ hashFiles('echocore/openxechain/build-minimal-toolchain-fast.sh') }}

  echocore-bundle:
    needs:
      - core-host-tests
      - toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout Echo360
        uses: actions/checkout@v5

      - name: Restore proven OpenXeChain toolchain
        uses: actions/cache/restore@v4
        with:
          path: /tmp/openxechain-sysroot
          key: echocore-openxechain-final-${{ env.ECHO_TOOLCHAIN_CACHE_VERSION }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-cmake-3.31.10-${{ hashFiles('echocore/openxechain/build-minimal-toolchain-fast.sh') }}
          fail-on-cache-miss: true

      - name: Forge EchoCore physical pairing XEX
        run: bash echocore/openxechain/build-echo-core-pairing.sh

      - name: Forge EchoCore resident SYS DLL XEX
        run: bash echocore/openxechain/build-echo-core-resident.sh

      - name: Forge EchoCore NOVA remote loader XEX
        run: bash echocore/openxechain/build-echo-core-loader.sh

      - name: Verify hardware-candidate bundle exists
        run: |
          set -euxo pipefail
          test -s /tmp/echocore-pairing-build/EchoCorePairing.xex
          test -s /tmp/echocore-resident-build/EchoCoreResident.xex
          test -s /tmp/echocore-loader-build/EchoCoreLoader.xex
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('/tmp/echocore-pairing-build/EchoCorePairing.xex'),
              Path('/tmp/echocore-resident-build/EchoCoreResident.xex'),
              Path('/tmp/echocore-loader-build/EchoCoreLoader.xex'),
          ]
          for path in files:
              data = path.read_bytes()
              assert data[:4] == b'XEX2', path
              print(path.name, len(data), 'bytes', 'XEX2')
          PY

      - name: Write physical-test manifest
        run: |
          cat > /tmp/EchoCore-HARDWARE-README.txt <<'EOF_MANIFEST'
          EchoCore hardware candidate

          Included:
          - EchoCorePairing.xex   : local pairing-token display/recovery
          - EchoCoreResident.xex  : resident authenticated LAN service
          - EchoCoreLoader.xex    : NOVA-launchable loader for the sibling resident

          Deliberately NOT included:
          - legacy EchoCore.xex bootstrap. Physical Corona/RGH testing proved that
            returning from its raw title _start can reboot the console after a
            successful EchoLink exchange. Keep it quarantined from hardware use.

          First hardware pass remains reversible: Pairing + Loader + Resident only.
          Do not install a DashLaunch boot plugin yet.
          EOF_MANIFEST

      - name: Upload EchoCore hardware-candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: EchoCore-HardwareCandidate-XEX-${{ github.sha }}
          path: |
            /tmp/echocore-pairing-build/EchoCorePairing.xex
            /tmp/echocore-resident-build/EchoCoreResident.xex
            /tmp/echocore-loader-build/EchoCoreLoader.xex
            /tmp/EchoCore-HARDWARE-README.txt
          if-no-files-found: error
          retention-days: 30

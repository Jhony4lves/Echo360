name: EchoCore XEX CI

on:
  workflow_dispatch:
  push:
    branches:
      - echocore/prehardware-integration
    paths:
      - ".github/workflows/echocore-xex-ci.yml"
      - "echocore/**"
  pull_request:
    paths:
      - ".github/workflows/echocore-xex-ci.yml"
      - "echocore/**"

concurrency:
  group: echocore-xex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENXECHAIN_BUILD_SHA: eed1fa65bf9577fd31625764b320a90182ea9ade
  OPENXECHAIN_SYSROOT: /tmp/openxechain-sysroot
  # PR #30 already proved and cached this exact pinned toolchain.
  ECHO_TOOLCHAIN_CACHE_KEY: echocore-openxechain-min-v2

jobs:
  core-host-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 6

    steps:
      - name: Checkout Echo360
        uses: actions/checkout@v5

      - name: Run complete EchoCore host suite
        run: bash echocore/tests/run-host-tests.sh

      - name: Verify physical pairing KDF vector
        run: |
          python3 - <<'PY'
          import hashlib
          token = bytes(range(16))
          expected = '7344e42de48a363d0454babae5d527f1bf0b43e319fd18da2062ebf524d050f4'
          actual = hashlib.sha256(b'ECHO360-PAIRING-TOKEN-V1' + token).hexdigest()
          assert actual == expected, (actual, expected)
          PY

  toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Echo360
        uses: actions/checkout@v5

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            binutils \
            ninja-build \
            make \
            python3 \
            python3-pip \
            git \
            zlib1g-dev
          python3 -m pip install --user "cmake==3.31.10"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version

      - name: Restore proven OpenXeChain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: /tmp/openxechain-sysroot
          key: ${{ env.ECHO_TOOLCHAIN_CACHE_KEY }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-cmake-3.31.10

      - name: Clone pinned OpenXeChain sources
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --no-checkout --filter=blob:none https://github.com/OpenXeChain/buildscript.git /tmp/openxechain
          cd /tmp/openxechain
          git checkout "$OPENXECHAIN_BUILD_SHA"
          git submodule sync --recursive
          git submodule update --init --depth 1 llvm xecorelib synthxex
          test "$(git rev-parse HEAD)" = "$OPENXECHAIN_BUILD_SHA"
          git submodule status llvm xecorelib synthxex

      - name: Build component-only OpenXeChain toolchain serially
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          LLVM_PARALLEL: 1
        run: |
          set -o pipefail
          : > /tmp/echocore-toolchain-build.log
          bash echocore/openxechain/build-minimal-toolchain-fast.sh /tmp/openxechain \
            2>&1 | tee /tmp/echocore-toolchain-build.log

      - name: Upload toolchain build log
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: echocore-toolchain-log-${{ github.sha }}
          path: /tmp/echocore-toolchain-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify component-only toolchain
        run: |
          test -x "$OPENXECHAIN_SYSROOT/bin/clang"
          test -x "$OPENXECHAIN_SYSROOT/bin/lld-link"
          test -x "$OPENXECHAIN_SYSROOT/bin/llvm-ar"
          test -x "$OPENXECHAIN_SYSROOT/bin/llvm-dlltool"
          test -x "$OPENXECHAIN_SYSROOT/bin/synthxex"
          test -s "$OPENXECHAIN_SYSROOT/lib/xecorelib.a"
          "$OPENXECHAIN_SYSROOT/bin/clang" --version
          "$OPENXECHAIN_SYSROOT/bin/synthxex" --help || true

  echocore-bundle:
    needs:
      - core-host-tests
      - toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout Echo360
        uses: actions/checkout@v5

      - name: Restore proven OpenXeChain toolchain
        uses: actions/cache/restore@v4
        with:
          path: /tmp/openxechain-sysroot
          key: ${{ env.ECHO_TOOLCHAIN_CACHE_KEY }}-${{ runner.os }}-${{ env.OPENXECHAIN_BUILD_SHA }}-cmake-3.31.10
          fail-on-cache-miss: true

      - name: Forge EchoCore hardware bootstrap
        run: bash echocore/openxechain/build-echo-core.sh

      - name: Forge EchoCore physical pairing XEX
        run: bash echocore/openxechain/build-echo-core-pairing.sh

      - name: Forge EchoCore plugin smoke XEX
        run: bash echocore/openxechain/build-echo-core-plugin-smoke.sh

      - name: Forge EchoCore resident SYS DLL XEX
        run: bash echocore/openxechain/build-echo-core-resident.sh

      - name: Verify complete pre-hardware bundle exists
        run: |
          set -euxo pipefail
          test -s /tmp/echocore-build/EchoCore.xex
          test -s /tmp/echocore-pairing-build/EchoCorePairing.xex
          test -s /tmp/echocore-plugin-build/EchoCorePluginSmoke.xex
          test -s /tmp/echocore-resident-build/EchoCoreResident.xex
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('/tmp/echocore-build/EchoCore.xex'),
              Path('/tmp/echocore-pairing-build/EchoCorePairing.xex'),
              Path('/tmp/echocore-plugin-build/EchoCorePluginSmoke.xex'),
              Path('/tmp/echocore-resident-build/EchoCoreResident.xex'),
          ]
          for path in files:
              data = path.read_bytes()
              assert data[:4] == b'XEX2', path
              print(path.name, len(data), 'bytes', 'XEX2')
          PY

      - name: Upload complete EchoCore pre-hardware bundle
        uses: actions/upload-artifact@v4
        with:
          name: EchoCore-Prehardware-XEX-${{ github.sha }}
          path: |
            /tmp/echocore-build/EchoCore.xex
            /tmp/echocore-pairing-build/EchoCorePairing.xex
            /tmp/echocore-plugin-build/EchoCorePluginSmoke.xex
            /tmp/echocore-resident-build/EchoCoreResident.xex
          if-no-files-found: error
          retention-days: 30

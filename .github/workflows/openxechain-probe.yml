name: OpenXeChain Probe

on:
  pull_request:
    paths:
      - ".github/workflows/openxechain-probe.yml"
      - "echocore/openxechain/**"

jobs:
  toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Echo360
        uses: actions/checkout@v5

      - name: Install OpenXeChain host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            binutils \
            ninja-build \
            make \
            python3 \
            python3-pip \
            python3-yaml \
            bzip2 \
            gzip \
            findutils \
            sed \
            tar \
            unzip \
            zip \
            gawk \
            zlib1g-dev
          python3 -m pip install --user "cmake==3.31.10"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version
          echo "Runner CPUs: $(nproc)"

      - name: Restore OpenXeChain toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: /tmp/openxechain-sysroot
          key: openxechain-v1-${{ runner.os }}-eed1fa65bf9577fd31625764b320a90182ea9ade-cmake-3.31.10

      - name: Clone pinned OpenXeChain buildscript
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          OPENXECHAIN_BUILD_SHA: eed1fa65bf9577fd31625764b320a90182ea9ade
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --no-checkout --filter=blob:none https://github.com/OpenXeChain/buildscript.git /tmp/openxechain
          cd /tmp/openxechain
          git checkout "$OPENXECHAIN_BUILD_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          test "$(git rev-parse HEAD)" = "$OPENXECHAIN_BUILD_SHA"
          git rev-parse HEAD
          git submodule status --recursive

      - name: Build OpenXeChain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          PREFIX: /tmp/openxechain-sysroot
          BUILD_TYPE: Release
        run: |
          cmake --version
          cd /tmp/openxechain
          ./build-toolchain.sh

      - name: Verify installed toolchain
        run: |
          test -x /tmp/openxechain-sysroot/bin/clang
          test -x /tmp/openxechain-sysroot/bin/clang++
          test -x /tmp/openxechain-sysroot/bin/synthxex
          /tmp/openxechain-sysroot/bin/clang --version
          /tmp/openxechain-sysroot/bin/synthxex --help || true

      - name: Record probe result
        run: |
          mkdir -p /tmp/echocore-probe
          {
            echo "OpenXeChain build: success"
            echo "Buildscript: eed1fa65bf9577fd31625764b320a90182ea9ade"
            echo "Cache hit: ${{ steps.toolchain-cache.outputs.cache-hit }}"
            echo "Runner CPUs: $(nproc)"
            echo "UTC: $(date -u +%FT%TZ)"
            echo "clang: $(/tmp/openxechain-sysroot/bin/clang --version | head -1)"
            echo "cmake: $(cmake --version | head -1)"
          } > /tmp/echocore-probe/result.txt

      - name: Upload probe record
        uses: actions/upload-artifact@v4
        with:
          name: openxechain-probe-${{ github.sha }}
          path: /tmp/echocore-probe/result.txt
          if-no-files-found: error
          retention-days: 14

  echocore:
    needs: toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout Echo360
        uses: actions/checkout@v5

      - name: Restore proven OpenXeChain toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/openxechain-sysroot
          key: openxechain-v1-${{ runner.os }}-eed1fa65bf9577fd31625764b320a90182ea9ade-cmake-3.31.10

      - name: Require toolchain cache
        run: |
          test "${{ steps.toolchain-cache.outputs.cache-hit }}" = "true"
          test -x /tmp/openxechain-sysroot/bin/clang
          test -x /tmp/openxechain-sysroot/bin/synthxex

      - name: Build EchoCore XEX
        env:
          OPENXECHAIN_SYSROOT: /tmp/openxechain-sysroot
        run: |
          bash echocore/openxechain/build-echo-core.sh

      - name: Upload EchoCore hardware bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: echocore-bootstrap-${{ github.sha }}
          path: /tmp/echocore-build/EchoCore.xex
          if-no-files-found: error
          retention-days: 14

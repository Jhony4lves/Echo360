name: Android CI

on:
  pull_request:
    paths:
      - "app/**"
      - "echocore/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - ".github/echo360-debug-keystore.b64"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "echocore/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - ".github/echo360-debug-keystore.b64"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up stable debug signing
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/echo360-debug-keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build EchoLink C reference server
        run: gcc -std=c11 -Wall -Wextra -Werror -O2 echocore/reference/host_ping_server.c -o /tmp/echolink-host-server

      - name: Probe EchoLink C reference server
        run: |
          /tmp/echolink-host-server 36000 >/tmp/echolink-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 0.2
          python3 tools/echolink_ping.py 127.0.0.1 36000
          wait $SERVER_PID

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echo360-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Android CI

on:
  pull_request:
    paths:
      - "app/**"
      - "echocore/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - ".github/echo360-debug-keystore.b64"
  push:
    branches:
      - main
      - fix/pairing-auth-release-icon-v1
    paths:
      - "app/**"
      - "echocore/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - ".github/echo360-debug-keystore.b64"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up stable signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/echo360-debug-keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build EchoLink C reference server
        run: gcc -std=c11 -Wall -Wextra -Werror -O2 echocore/reference/host_ping_server.c -o /tmp/echolink-host-server

      - name: Probe EchoLink C reference server
        run: |
          /tmp/echolink-host-server 36000 >/tmp/echolink-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 0.2
          python3 tools/echolink_ping.py 127.0.0.1 36000
          wait $SERVER_PID

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="/tmp/Echo360-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/Echo360-release.apk"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          mkdir -p app/build/diagnostics
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee app/build/diagnostics/unit-tests.log
          EXIT_CODE=${PIPESTATUS[0]}
          exit "$EXIT_CODE"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo360-unit-test-reports-${{ github.sha }}
          path: |
            app/build/diagnostics/unit-tests.log
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echo360-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: echo360-release-${{ github.sha }}
          path: app/build/outputs/apk/release/Echo360-release.apk
          if-no-files-found: error
          retention-days: 30
